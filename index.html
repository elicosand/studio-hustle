<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122A">
<meta name="description" content="Studio Hustle: an idle music tycoon. Rise from a rundown apartment to the stadium.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio Hustle">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html { height: 100%; background: #14122A; }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Studio Hustle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone game. HUD on top, scaled top-down room filling the middle, station bar + actions, tab bar. Single dark night look by choice; each location brings its own room palette. */
:root {
  --ink: #14122A;
  --panel: #221F3A;
  --panel-2: #2E2A4A;
  --line: #3A3558;
  --text: #F4F1EA;
  --muted: #B9B3CF;
  --cash: #8BF0A0;
  --gem: #FFC94A;
  --accent: #FF6FAE;
  --floor: #4A3B33;
  --go: #2FB653;
  --skin: #C68A5C;
  --phones: #FF6FAE;
  --display: 'Bungee', 'Arial Black', Impact, sans-serif;
  --body: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--text); font-family: var(--body);
  overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font-family: var(--body); color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
button:focus-visible { outline: 3px solid var(--gem); outline-offset: 2px; }
/* the game is pinned to the real screen edges and handles the notch and home bar itself */
.app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); background: var(--ink); }

/* HUD */
.hud { display: flex; align-items: center; gap: 8px; padding-block: 12px 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.pill { height: 42px; border-radius: 999px; background: var(--panel); display: flex; align-items: center; gap: 8px; }
.cash-pill { flex: 1; min-width: 0; padding: 0 14px 0 6px; }
.coin { width: 30px; height: 30px; border-radius: 50%; background: var(--cash); color: var(--ink); font-family: var(--display); font-size: 16px; display: grid; place-items: center; flex: none; }
.cash-col { display: flex; flex-direction: column; min-width: 0; line-height: 1; }
.cash-num { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cash-rate { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.gem-pill { padding: 0 4px 0 10px; }
.gem-num { font-family: var(--display); font-size: 17px; }
.round-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--gem); color: var(--ink); display: grid; place-items: center; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text); }

/* Room */
.room-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--floor); transition: background .4s; }
.stage { position: absolute; left: 50%; top: 50%; width: 390px; height: 480px; transform-origin: center; }
.abs { position: absolute; }
.loc-chip { position: absolute; top: 8px; left: max(10px, env(safe-area-inset-left, 0px)); z-index: 5; display: flex; align-items: center; gap: 6px;
  background: rgba(20,18,42,.82); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 12px; font-weight: 700; pointer-events: none; }
.loc-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.fame-chip { position: absolute; top: 42px; left: max(10px, env(safe-area-inset-left, 0px)); z-index: 5; background: rgba(20,18,42,.82); color: var(--gem);
  border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; pointer-events: none; }
.daily-btn { position: absolute; top: 8px; right: max(10px, env(safe-area-inset-right, 0px)); z-index: 5; width: 48px; height: 48px; border-radius: 14px;
  background: var(--text); color: var(--ink); display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.daily-btn .dot { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--text); }
.mode-btn { width: 50px; height: 46px; border-radius: 14px; background: var(--panel-2); color: var(--text); font-family: var(--display); font-size: 13px; flex: none; }
.days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--panel-2); border-radius: 14px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; border: 2px solid transparent; }
.day b { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.day span { font-size: 13px; font-weight: 700; }
.day.got { opacity: .55; } .day.got span { color: var(--cash); }
.day.today { border-color: var(--accent); }
.day.big { grid-column: span 2; }
.vols { display: flex; flex-direction: column; gap: 6px; background: var(--panel-2); border-radius: 16px; padding: 8px 14px; }
.vol { display: grid; grid-template-columns: 112px minmax(0, 1fr) 34px; align-items: center; gap: 10px; min-height: 48px; }
.vol label { font-size: 15px; font-weight: 700; }
.vol output { font-family: var(--display); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.vol input[type=range] { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); background: transparent; }
.toggle { display: flex; align-items: center; justify-content: space-between; background: var(--panel-2); border-radius: 16px; padding: 0 8px 0 14px; height: 56px; font-size: 15px; font-weight: 700; }
.toggle span.sw2 { width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.toggle span.sw2::after { content: ""; position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); transition: left .2s; }
.toggle[aria-pressed="true"] span.sw2 { background: var(--go); }
.toggle[aria-pressed="true"] span.sw2::after { left: 26px; }

.station { position: absolute; display: block; }
.badge { position: absolute; display: flex; align-items: center; gap: 4px; background: var(--text); color: var(--ink);
  border-radius: 999px; padding: 3px 9px 3px 3px; font-size: 13px; font-weight: 700; z-index: 3; white-space: nowrap; transition: background .2s; }
.station.sel .badge { background: var(--accent); }
.badge .ic { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
.badge .up { width: 18px; height: 18px; border-radius: 50%; background: var(--go); display: grid; place-items: center; margin-left: 2px; }
.prog { position: absolute; height: 7px; border-radius: 999px; background: rgba(20,18,42,.75); overflow: hidden; z-index: 3; }
.prog i { display: block; height: 100%; width: 0; background: var(--cash); border-radius: 999px; }
.sel-ring { position: absolute; inset: -6px; border-radius: 16px; border: 3px solid var(--accent); opacity: 0; transition: opacity .2s; pointer-events: none; }
.station.sel .sel-ring { opacity: 1; }
.tap-hint { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  border: 3px solid var(--text); opacity: 0; pointer-events: none; z-index: 4; }
.station.idle .tap-hint { animation: ping 1.4s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(1.6); opacity: 0 } }

.lockspot { position: absolute; inset: 0; border-radius: 16px; border: 3px dashed #8C86A6; background: rgba(20,18,42,.45);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; z-index: 2; }
.lockspot .lk { width: 46px; height: 46px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; }
.lockspot b { font-size: 14px; font-weight: 700; text-align: center; padding: 0 6px; }
.price { font-family: var(--display); font-size: 14px; color: var(--ink); background: #8C86A6; border-radius: 999px; padding: 3px 12px; }
.lockspot.can .price { background: var(--cash); }
.lockspot.can { border-color: var(--cash); }

.crew { position: absolute; width: 62px; height: 83px; z-index: 5; pointer-events: none; }
.crew svg { animation: bob .6s ease-in-out infinite alternate; }
.artist { position: absolute; width: 70px; height: 96px; z-index: 6; transition: left .55s ease, top .55s ease; pointer-events: none; }
.artist.working svg { animation: bob .45s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-4px) } }
.skin { fill: var(--skin); } .phones { fill: var(--phones); }

.floater { position: absolute; z-index: 8; font-family: var(--display); font-size: 17px; color: var(--cash); pointer-events: none;
  text-shadow: 0 2px 0 rgba(0,0,0,.45); animation: rise 1s ease-out forwards; white-space: nowrap; }
@keyframes rise { from { transform: translate(-50%, 0); opacity: 1 } to { transform: translate(-50%, -46px); opacity: 0 } }

/* Bottom controls */
.controls { display: flex; flex-direction: column; gap: 8px; padding-block: 10px 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--ink); }
.sbar { height: 62px; box-sizing: border-box; background: var(--panel); border: 2px solid var(--accent); border-radius: 18px;
  padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; }
.sbar-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.sbar-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbar-name small { color: var(--muted); font-weight: 600; font-size: 13px; }
.mile { height: 5px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.mile i { display: block; height: 100%; background: var(--gem); width: 0; }
.mile-label { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-btn { -webkit-touch-callout: none; touch-action: none; height: 46px; padding: 0 14px; border-radius: 14px; background: var(--cash); color: var(--ink); font-family: var(--display); font-size: 15px;
  display: flex; align-items: center; gap: 6px; flex: none; box-shadow: 0 3px 0 #4FA864; transition: transform .08s; }
.up-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #4FA864; }
.up-btn:disabled { background: var(--panel-2); color: var(--muted); box-shadow: none; cursor: default; }
.actions { display: flex; gap: 8px; }
.act { flex: 1; height: 46px; border-radius: 14px; background: var(--panel); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; }
.act.hype { flex: 1.25; background: var(--accent); color: var(--ink); }
.act:disabled { opacity: .55; cursor: default; }
.act.ready { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(255,201,74,.35) } }

.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--ink); border-top: 1px solid var(--panel-2);
  padding-top: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tab { height: 52px; color: var(--muted); font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
.tab.on { color: var(--accent); }
.tab-pct { position: absolute; top: 2px; right: 50%; margin-right: -30px; background: var(--accent); color: var(--ink); font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 5px; }
.tab-pct.full { background: var(--cash); animation: glow 1.6s ease-in-out infinite; }

/* Sheets */
.scrim { position: absolute; inset: 0; background: rgba(8,7,20,.6); z-index: 20; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 84%; overflow-y: auto; background: var(--panel); border-radius: 24px 24px 0 0; box-sizing: border-box;
  padding-top: 18px; padding-bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 12px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0 } }
.sheet > * { flex-shrink: 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.sheet h2 { font-family: var(--display); font-size: 20px; margin: 0; font-weight: 400; }
.close { width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); display: grid; place-items: center; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.row { display: flex; align-items: center; gap: 12px; background: var(--panel-2); border-radius: 16px; padding: 10px 10px 10px 12px; }
.row .rt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .rt b { font-size: 15px; } .row .rt span { font-size: 12px; color: var(--muted); }
.row .ric { width: 40px; height: 40px; border-radius: 12px; background: var(--ink); display: grid; place-items: center; flex: none; }
.hire { height: 42px; padding: 0 14px; border-radius: 12px; background: var(--cash); color: var(--ink); font-family: var(--display); font-size: 13px; flex: none; }
.hire.money { background: var(--gem); }
.hire.on { background: var(--panel); color: var(--cash); box-shadow: inset 0 0 0 2px var(--cash); }
.row.locked .rt b { color: var(--muted); }
.hire:disabled { background: var(--line); color: var(--muted); cursor: default; }
.hired { font-size: 13px; font-weight: 700; color: var(--cash); padding: 0 8px; }
.big-bar { height: 14px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.big-bar i { display: block; height: 100%; background: var(--accent); }
.loc { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--muted); }
.loc.now { color: var(--text); } .loc.done { color: var(--cash); }
.loc .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.loc.now .dot { background: var(--accent); } .loc.done .dot { background: var(--cash); }
.dresser { display: flex; justify-content: center; align-items: flex-end; background: #2B2645; border-radius: 18px; padding-block: 18px 6px; overflow: hidden; position: relative; min-height: 236px; }
.dresser::before { content: ""; position: absolute; left: 50%; bottom: 8px; width: 190px; height: 34px; margin-left: -95px; border-radius: 50%; background: #3A3460; }
.dresser svg { position: relative; transform-origin: 50% 100%; animation: idle 1.8s ease-in-out infinite alternate; }
@keyframes idle { from { transform: translateY(0) scaleY(1) } to { transform: translateY(-2px) scaleY(1.01) } }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; box-shadow: inset 0 0 0 3px var(--panel); }
.sw.on { border-color: var(--text); }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cta { height: 52px; border-radius: 16px; background: var(--cash); color: var(--ink); font-family: var(--display); font-size: 17px; box-shadow: 0 3px 0 #4FA864; flex: none; }
.cta:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: default; }
.cta.pink { background: var(--accent); box-shadow: 0 3px 0 #B84778; }
.ghost { height: 50px; border-radius: 16px; background: var(--panel-2); font-size: 15px; font-weight: 700; flex: none; }
.welcome { display: flex; flex-direction: column; gap: 8px; text-align: center; align-items: center; }
.welcome .amt { font-family: var(--display); font-size: 36px; color: var(--cash); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec + .sec { border-top: 1px solid var(--line); padding-top: 14px; }
.sec h3 { margin: 0; font-size: 16px; font-weight: 700; }
.soon { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--line); border-radius: 999px; padding: 6px 10px; flex: none; }
.keeps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.keeps div { background: var(--panel-2); border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.4; color: var(--muted); }
.keeps b { display: block; color: var(--text); font-size: 13px; margin-bottom: 2px; }

.tut { position: absolute; left: 16px; right: 16px; z-index: 15; display: flex; align-items: center; gap: 10px; background: var(--text); color: var(--ink);
  border-radius: 16px; padding: 10px 10px 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: up .25s ease-out; }
.tut p { flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 700; line-height: 1.35; }
.tut button { flex: none; height: 36px; padding: 0 10px; border-radius: 10px; background: rgba(20,18,42,.08); font-size: 12px; font-weight: 700; color: var(--ink); }
.tut-ptr { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 4px solid var(--gem); z-index: 16; pointer-events: none;
  box-shadow: 0 0 0 4px rgba(255,201,74,.25); animation: tutpulse 1.1s ease-in-out infinite; }
@keyframes tutpulse { 50% { transform: scale(1.18); box-shadow: 0 0 0 10px rgba(255,201,74,0); } }
.email { -webkit-user-select: text; user-select: text; font-family: var(--display); font-size: 15px; color: var(--text); word-break: break-all; }
.toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); background: var(--text); color: var(--ink);
  font-size: 14px; font-weight: 700; padding: 10px 16px; border-radius: 999px; z-index: 30; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
  animation: up .2s ease-out; box-shadow: 0 6px 20px rgba(0,0,0,.35); }

@media (prefers-reduced-motion: reduce) {
  .artist { transition: none; } .artist.working svg, .crew svg, .dresser svg, .tut-ptr, .station.idle .tap-hint, .act.ready, .tab-pct.full { animation: none; }
  .floater { animation-duration: .01s; }
}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="hud">
    <div class="pill cash-pill">
      <div class="coin" aria-hidden="true">$</div>
      <div class="cash-col">
        <span class="cash-num" id="cash">$0</span>
        <span class="cash-rate" id="rate">+$0 / sec</span>
      </div>
    </div>
    <div class="pill gem-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFC94A" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"></path></svg>
      <span class="gem-num" id="gems">25</span>
      <button class="round-btn" id="buyGems" aria-label="Open the shop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <button class="icon-btn" id="settings" aria-label="Settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
  </header>

  <div class="room-wrap" id="roomWrap">
    <div class="loc-chip"><i></i><span id="locName">Rundown Apartment</span></div>
    <div class="fame-chip" id="fameChip" hidden></div>
    <button class="daily-btn" id="goalsBtn" aria-label="Goals" style="top:64px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg>
      <span class="dot" id="goalsDot" hidden></span>

const cycleTime = st => st.cycle / Math.pow(2, milesHit(lvl(st.id)));
const fame = () => 1 + FAME_PER_ALBUM * (S.albums || 0);
const gearMult = () => 1 + SLOTS.reduce((a, [sl]) => { const it = itemById(S.equip && S.equip[sl]); return a + (it ? it.bonus : 0); }, 0);
const boostMult = () => (S.perks.goldenMic ? 2 : 1) * (S.perks.monitors ? 1.5 : 1);
const payout = st => st.base * lvl(st.id) * fame() * gearMult() * boostMult();
const bestRate = () => LOC().stations.filter(st => lvl(st.id)).reduce((a, st) => Math.max(a, payout(st) / cycleTime(st)), 0);
const skipValue = secs => Math.round(Math.max(perSec(), bestRate()) * secs);
const upCost = st => Math.ceil(st.cost * Math.pow(st.growth, lvl(st.id) - 1));
// cost of buying n levels at once: geometric series from the current level's price
const bulkCost = (st, n) => Math.ceil(upCost(st) * (Math.pow(st.growth, n) - 1) / (st.growth - 1));
function buyPlan(st) {
  if (S.buyMode === 'max') {
    const c0 = upCost(st), g = st.growth;
    let n = Math.floor(Math.log(1 + S.cash * (g - 1) / c0) / Math.log(g));
    n = Math.max(1, n);
    while (n > 1 && bulkCost(st, n) > S.cash) n--;   // guard against float rounding
    return { n, cost: bulkCost(st, n) };
  }
  const n = S.buyMode === 10 ? 10 : 1;
  return { n, cost: bulkCost(st, n) };
}
const hypeOn = () => Date.now() < S.hypeUntil;
const mult = () => hypeOn() ? 2 : 1;
const perSec = () => LOC().stations.reduce((a, st) => a + (lvl(st.id) && S.crew[st.id] ? payout(st) / cycleTime(st) : 0), 0);
const movePct = () => Math.min(100, S.earned / LOC().goal * 100);

function fmt(n) {
  if (n < 1000) return '$' + (n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n));
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let i = -1; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return '$' + (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + u[i];
}
function earn(v) { S.cash += v; S.earned += v; S.stats.lifetime += v; }

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const stage = $('stage'), wrap = $('roomWrap'), artist = $('artist');
let els = {};

function buildRoom() {

      <span class="badge" style="left:8px;top:-16px"><span class="ic">${svgIc(st.icon)}</span><span class="lv">1</span><span class="up" hidden>${UP}</span></span>

  }).join('');
  els = {};
  loc.stations.forEach(st => {

    b.addEventListener('click', () => tapStation(st));
  });
  moveArtist(def(S.selected));
  if (actx) playMusic();
}

function fit() {
  const r = wrap.getBoundingClientRect();
  const s = Math.min(r.width / 390, (r.height - 4) / 480);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
new ResizeObserver(fit).observe(wrap);

function moveArtist(st) {
  const [x, y] = st ? st.spot : LOC().home;
  artist.style.left = x + 'px'; artist.style.top = y + 'px';
}
function floater(st, text) {
  const b = els[st.id].b;
  const f = document.createElement('span');
  f.className = 'floater'; f.textContent = text;
  f.style.left = (b.offsetLeft + b.offsetWidth / 2) + 'px';
  f.style.top = (b.offsetTop + 8) + 'px';
  stage.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}
let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  $('app').appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 1800);
}

// ---------- actions ----------
function tapStation(st) {
  if (!lvl(st.id)) {
    if (S.cash >= st.unlock) {
      S.cash -= st.unlock; S.levels[st.id] = 1; S.selected = st.id; S.stats.unlocks++;
      sfx('unlock'); toast(st.name + ' unlocked'); moveArtist(st); save();
    } else { sfx('denied'); toast('Need ' + fmt(st.unlock) + ' to unlock ' + st.name); }
    render(); return;
  }
  S.selected = st.id;
  if (!S.crew[st.id] && !S.running[st.id]) { S.running[st.id] = true; S.prog[st.id] = S.prog[st.id] || 0; sfx('tap'); }
  moveArtist(st);
  render();
}
function buyOnce(quiet) {
  const st = def(S.selected); const { n, cost } = buyPlan(st);
  if (S.cash < cost) { if (!quiet) sfx('denied'); return false; }
  const before = milesHit(lvl(st.id));
  S.cash -= cost; S.levels[st.id] += n; S.stats.upgrades += n; S.stats.maxLevel = Math.max(S.stats.maxLevel, lvl(st.id));
  if (milesHit(lvl(st.id)) > before) { sfx('milestone'); toast(st.name + ' hit Lv ' + lvl(st.id) + ': 2x speed'); }
  else sfx('upgrade');
  render();
  return true;
}
// press and hold: buy once, then keep buying faster until released or out of cash
let holdT = null;
function stopHold() { clearTimeout(holdT); holdT = null; }
$('upBtn').addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  e.preventDefault();
  stopHold();
  if (!buyOnce()) return;
  let delay = 380;
  const step = () => { if (!buyOnce(true)) return stopHold(); delay = Math.max(55, delay * 0.82); holdT = setTimeout(step, delay); };
  holdT = setTimeout(step, delay);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('upBtn').addEventListener(ev, stopHold));
window.addEventListener('blur', stopHold);
$('upBtn').addEventListener('click', e => { if (e.detail === 0) buyOnce(); });   // keyboard Enter/Space
$('upBtn').addEventListener('contextmenu', e => e.preventDefault());
$('modeBtn').addEventListener('click', () => {

});
$('hypeBtn').addEventListener('click', () => openTab('hype'));
function addHype() {
  const now = Date.now(), base = Math.max(now, S.hypeUntil);
  const add = Math.min(HYPE_PER_AD * 1000, now + HYPE_CAP * 1000 - base);
  if (add <= 0) { toast('Hype is maxed at 2 hours'); return; }
  S.hypeUntil = base + add; S.stats.hypes++; sfx('hype'); save(); render();
  toast('+' + Math.round(add / 60000) + ' min of 2x Hype');
}
let adTimer = null;
function watchAd(onDone) {

  let left = AD_SECONDS;
  openSheet(`<div class="welcome"><span class="lbl">Ad plays here</span><span class="amt" id="adCount">${left}</span>

  }, 1000);
}
$('dailyBtn').addEventListener('click', () => openTab('daily'));
$('tutSkip').addEventListener('click', () => { S.tut = TUT.length; save(); updateTut(); });
$('goalsBtn').addEventListener('click', () => openTab('goals'));
$('crateBtn').addEventListener('click', () => {
  if (Date.now() < S.crateReady) return;
  const v = Math.max(25, skipValue(45));
  earn(v); S.gems += 3; S.stats.crates++; S.crateReady = Date.now() + CRATE_CD * 1000; sfx('reward');
  pendingBonus = v;
  openSheet(`<div class="sheet-head"><h2>Crate opened</h2>${closeBtn()}</div>

$('buyGems').addEventListener('click', () => openTab('shop'));

function moveUp() {
  const next = S.loc + 1;
  if (!LOCATIONS[next] || movePct() < 100) return;
  Object.assign(S, runState(next));
  S.maxLoc = Math.max(S.maxLoc || 0, next);
  S.stats.lifetime = Math.max(S.stats.lifetime, 0);
  buildRoom(); save(); render(); sfx('move');
  const loc = LOC();
  openSheet(`<div class="welcome"><h2>Welcome to the ${loc.name}</h2>
    <p>New space, bigger money. Your ${loc.stations[0].name} is ready. Tap it to start earning, then unlock the rest.</p></div>
    <button class="cta" data-close>Let's go</button>`);
}
function dropAlbum() {
  if (S.loc < 1 || S.earned < albumReq()) return;
  S.albums = (S.albums || 0) + 1;
  Object.assign(S, runState(0));
  const it = ITEMS.find(i => i.album === S.albums);
  if (it) S.owned[it.id] = true; else S.gems += 50;
  buildRoom(); save(); render(); sfx('move');
  const prev = it ? `<div class="dresser" style="width:100%">${bigArtist(Object.assign({}, S.equip, { [it.slot]: it.id }))}</div>` : '';
  openSheet(`<div class="welcome"><h2>Album #${S.albums} is out</h2><span class="amt" style="color:var(--gem)">Fame x${fame().toFixed(2)}</span>
    <p>Every station now earns ${Math.round((fame() - 1) * 100)}% more, forever.${it ? ` You unlocked the <b style="color:var(--text)">${it.name}</b>, an album exclusive worth +${Math.round(it.bonus * 100)}% income while worn.` : ' You also got 50 gems.'}</p>${prev}</div>
    ${it ? `<button class="cta" data-equip="${it.id}" data-then="close">Wear it</button>` : ''}
    <button class="ghost" data-close>Start the next run</button>`);
}

// ---------- sheets ----------
const closeBtn = () => '<button class="close" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>';
function openSheet(html) {
  $('sheet').innerHTML = html; $('scrim').hidden = false;
  const c = $('sheet').querySelector('[data-close]'); if (c) c.focus();
}
let pendingDaily = false, pendingBonus = 0;
function grant(id) {
  const o = OFFERS[id]; if (!o) return;
  if (o.once) S.perks[id] = true;
  if (o.gemsOut) S.gems += o.gemsOut;
  if (o.skip) { const v = skipValue(o.skip); earn(v); toast('+' + fmt(v) + ' from the time skip'); }
  if (id === 'starter') { S.owned.flame = true; S.gems += 300; const v = skipValue(4 * 3600); earn(v); }
  if (!o.skip) toast(o.name + (o.gemsOut ? ' added' : ' unlocked'));
  sfx(o.skip ? 'reward' : 'unlock'); save(); render();
}
function closeSheet() {
  $('scrim').hidden = true;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === 'studio'));
  if (pendingDaily) { pendingDaily = false; if (dailyReady()) openTab('daily'); }
}
function claimDaily() {
  if (!dailyReady()) return;
  const day = nextStreak(), r = DAILY[day - 1];
  const cash = r.min ? dailyCash(r.min) : 0;
  if (cash) earn(cash);
  S.gems += r.gems;
  S.daily = { last: dayKey(), streak: day };
  sfx('reward'); save(); render();
  openSheet(`<div class="welcome"><h2>Day ${day} claimed</h2>
    <span class="amt">${[cash ? '+' + fmt(cash) : '', r.gems ? '+' + r.gems + ' gems' : ''].filter(Boolean).join(' · ')}</span>
    <p>${day === 7 ? 'You finished the week. The streak starts over tomorrow.' : 'Come back tomorrow for day ' + (day + 1) + '. Miss a day and the streak resets.'}</p></div>
    <button class="cta" data-close>Nice</button>`);
}
$('scrim').addEventListener('click', e => {
  if (e.target === $('scrim') || e.target.closest('[data-close]')) return closeSheet();
  const hire = e.target.closest('[data-hire]');
  if (hire) {
    const st = def(hire.dataset.hire);
    if (st && S.cash >= st.crewCost && lvl(st.id)) { S.cash -= st.crewCost; S.crew[st.id] = true; S.running[st.id] = true; S.stats.hires++; sfx('unlock'); toast(st.crew + ' hired'); save(); render(); openTab('crew'); }
    return;
  }
  if (e.target.closest('[data-claim]')) return claimDaily();
  if (e.target.closest('[data-copy-email]')) {
    const sel = () => { const r = document.createRange(); r.selectNodeContents($('fbEmail')); const s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r); toast('Email selected. Copy it from the menu'); };
    try { navigator.clipboard.writeText(CONTACT).then(() => toast('Email copied'), sel); } catch (err) { sel(); }
    return;
  }
  const gc = e.target.closest('[data-goal]');
  if (gc) { const g = GOALS.find(x => x.id === gc.dataset.goal); if (g && goalReady(g) && !S.goalsDone[g.id]) { S.goalsDone[g.id] = true; S.gems += g.gems; sfx('reward'); toast('+' + g.gems + ' gems'); save(); render(); } return openTab('goals'); }
  const adb = e.target.closest('[data-ad]');
  if (adb) {
    const kind = adb.dataset.ad;
    if (kind === 'hype') return watchAd(() => { addHype(); openTab('hype'); });
    if (kind === 'bonus') { const v = pendingBonus; pendingBonus = 0; return watchAd(() => { if (v) { earn(v); sfx('reward'); } openSheet(`<div class="welcome"><h2>Doubled</h2><span class="amt">+${fmt(v)}</span></div><button class="cta" data-close>Nice</button>`); render(); save(); }); }
  }
  const eq = e.target.closest('[data-equip]');
  if (eq) { const it = itemById(eq.dataset.equip); if (it && S.owned[it.id]) { S.equip[it.slot] = it.id; applyLook(); save(); render(); sfx('tap'); } return eq.dataset.then === 'close' ? closeSheet() : openTab('style'); }
  const uq = e.target.closest('[data-unequip]');
  if (uq) { const it = itemById(uq.dataset.unequip); if (it && it.slot !== 'top') { S.equip[it.slot] = null; applyLook(); save(); render(); } return openTab('style'); }
  const bi = e.target.closest('[data-buy-item]');
  if (bi) { const it = itemById(bi.dataset.buyItem); if (it && !S.owned[it.id]) { if (S.gems >= it.gems) { S.gems -= it.gems; S.owned[it.id] = true; S.equip[it.slot] = it.id; applyLook(); sfx('unlock'); toast(it.name + ' unlocked'); save(); render(); } else { sfx('denied'); toast('Not enough gems'); } } return openTab(bi.dataset.from || 'style'); }
  const bo = e.target.closest('[data-buy]');
  if (bo) { const id = bo.dataset.buy, o = OFFERS[id]; if (!o) return;
    if (o.money) return openTab('pay:' + id);
    if (S.gems < o.gems) { sfx('denied'); toast('Not enough gems'); return; }
    S.gems -= o.gems; grant(id); return openTab('shop'); }
  const pay = e.target.closest('[data-pay]');
  if (pay) { grant(pay.dataset.pay); return openTab('shop'); }
  const sw = e.target.closest('[data-skin],[data-phones]');
  if (sw) { if (sw.dataset.skin) S.skin = sw.dataset.skin; if (sw.dataset.phones) S.phones = sw.dataset.phones; applyLook(); save(); openTab('style'); return; }
  if (e.target.closest('[data-move-ask]')) return openTab('move-confirm');
  if (e.target.closest('[data-move]')) return moveUp();
  if (e.target.closest('[data-album-ask]')) return openTab('album-confirm');
  if (e.target.closest('[data-album]')) return dropAlbum();
  if (e.target.closest('[data-reset-ask]')) return openTab('reset');
  if (e.target.closest('[data-reset]')) { S = fresh(); S.tut = 0; tutShownAt = 0; applyLook(); buildRoom(); save(); closeSheet(); render(); toast('New career started'); }
});
$('scrim').addEventListener('input', e => {

const starPts = (cx, cy, r) => Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; return (cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1); }).join(' ');
const lookOf = (eq, slot) => { const it = itemById(eq[slot]); return it ? it.look : null; };
// Simple front-facing figure shared by the in-room artist and the crew.
// f: { body, trim, style, skin (color or null for the player's tone), hair, phones, hat, neck, face, cap }
function miniFigure(f, w, h) {
  const K = '#1B1830', ln = `stroke="${K}" stroke-width="6" stroke-linejoin="round"`;
  const sk = f.skin ? `fill="${f.skin}"` : 'class="skin"';
  let o = `<svg width="${w}" height="${h}" viewBox="0 0 160 214" aria-hidden="true">
    <ellipse cx="80" cy="204" rx="40" ry="9" fill="#000" opacity="0.3"></ellipse>
    <path d="M58 146 H80 V193 H51 Q50 168 58 146 Z" fill="#2C2F48" ${ln}></path><path d="M80 146 H102 Q110 168 109 193 H80 Z" fill="#2C2F48" ${ln}></path>
    <rect x="52" y="188" width="28" height="13" rx="6" fill="#F4F1EA" ${ln}></rect><rect x="80" y="188" width="28" height="13" rx="6" fill="#F4F1EA" ${ln}></rect>
    <rect x="41" y="104" width="17" height="46" rx="8.5" fill="${f.body}" ${ln} transform="rotate(9 50 104)"></rect>
    <rect x="102" y="104" width="17" height="46" rx="8.5" fill="${f.body}" ${ln} transform="rotate(-9 110 104)"></rect>
    <circle ${sk} cx="43" cy="152" r="9" ${ln}></circle><circle ${sk} cx="117" cy="152" r="9" ${ln}></circle>
    <path d="M55 113 Q55 98 80 98 Q105 98 105 113 L104 158 Q80 164 56 158 Z" fill="${f.body}" ${ln}></path>`;
  o += f.style === 'jacket'
    ? `<path d="M80 104 V158" stroke="${f.trim}" stroke-width="5"></path><path d="M64 99 L80 114 L72 98 Z M96 99 L80 114 L88 98 Z" fill="${f.trim}"></path>`
    : `<path d="M62 103 Q80 91 98 103" fill="none" stroke="${f.trim}" stroke-width="9" stroke-linecap="round"></path>`;
  o += `<ellipse ${sk} cx="80" cy="60" rx="35" ry="36" ${ln}></ellipse>
    <path d="M45 60 Q41 22 80 21 Q119 22 115 60 Q109 43 96 40 Q89 49 77 44 Q61 41 45 60 Z" fill="${f.hair || '#231A17'}" ${ln}></path>`;
  if (f.neck) o += `<path d="M66 99 Q80 124 94 99" fill="none" stroke="${f.neck.color}" stroke-width="6" stroke-linecap="round"></path>`;
  if (f.cap) o += `<path d="M46 46 Q46 18 80 18 Q114 18 114 46 Z" fill="${f.cap}" ${ln}></path><path d="M46 44 H124" stroke="${f.cap}" stroke-width="9" stroke-linecap="round"></path>`;
  const hat = f.hat;
  if (hat && hat.style === 'beanie') o += `<path d="M46 50 Q46 18 80 18 Q114 18 114 50 Z" fill="${hat.color}" ${ln}></path><circle cx="80" cy="14" r="10" fill="${hat.color}" ${ln}></circle>`;
  if (hat && hat.style === 'bucket') o += `<ellipse cx="80" cy="42" rx="44" ry="10" fill="${hat.color}" ${ln}></ellipse><path d="M54 41 Q55 16 80 16 Q105 16 106 41 Z" fill="${hat.color}" ${ln}></path>`;
  if (hat && hat.style === 'crown') o += `<polygon points="54,34 59,8 70,24 80,3 90,24 101,8 106,34" fill="${hat.color}" ${ln}></polygon>`;
  if (f.phones) o += `<path d="M43 66 Q43 14 80 14 Q117 14 117 66" fill="none" stroke="${K}" stroke-width="9" stroke-linecap="round"></path>
    <ellipse class="phones" cx="45" cy="68" rx="11" ry="15" ${ln}></ellipse><ellipse class="phones" cx="115" cy="68" rx="11" ry="15" ${ln}></ellipse>`;
  const face = f.face;
  if (face && face.style === 'plain') o += `<rect x="56" y="58" width="23" height="16" rx="6" fill="${face.color}" ${ln}></rect><rect x="81" y="58" width="23" height="16" rx="6" fill="${face.color}" ${ln}></rect>`;
  else if (face && face.style === 'star') o += `<polygon points="${starPts(68, 66, 13)}" fill="${face.color}" ${ln}></polygon><polygon points="${starPts(92, 66, 13)}" fill="${face.color}" ${ln}></polygon>`;
  else o += `<ellipse cx="69" cy="68" rx="5.5" ry="9" fill="${K}"></ellipse><ellipse cx="91" cy="68" rx="5.5" ry="9" fill="${K}"></ellipse>`;
  return o + '</svg>';
}
function smallArtist(eq = S.equip) {
  const t = lookOf(eq, 'top') || itemById('basic').look;
  return miniFigure({ body: t.body, trim: t.trim, style: t.style, phones: true, hat: lookOf(eq, 'hat'), neck: lookOf(eq, 'neck'), face: lookOf(eq, 'face') }, 70, 94);

  const ct = cycleTime(st);
  $('sbName').innerHTML = `${st.name} <small>Lv ${L} · ${fmt(payout(st) * mult())} / ${ct < 1 ? ct.toFixed(2) : ct.toFixed(1)}s</small>`;
  $('sbMile').style.width = next ? ((L - prev) / (next - prev) * 100) + '%' : '100%';
  $('sbMileLabel').textContent = next ? `Lv ${next}: 2x speed` : 'Max speed reached';
  const plan = buyPlan(st);
  $('modeBtn').textContent = S.buyMode === 'max' ? 'MAX' : 'x' + S.buyMode;
  $('upCost').textContent = (S.buyMode === 1 ? '' : '+' + plan.n + ' ') + fmt(plan.cost);
  $('upBtn').disabled = S.cash < plan.cost;
  $('upBtn').setAttribute('aria-label', `Upgrade ${st.name} by ${plan.n} level${plan.n > 1 ? 's' : ''} for ${fmt(plan.cost)}`);
  $('dailyDot').hidden = !dailyReady();
  $('goalsDot').hidden = !activeGoals().some(goalReady);

  const now = Date.now();
  const hb = $('hypeBtn');
  if (hypeOn()) { $('hypeLbl').textContent = '2x · ' + hms(S.hypeUntil - now); hb.classList.remove('ready'); }
  else { $('hypeLbl').textContent = '2x Hype'; hb.classList.add('ready'); }
  const cb = $('crateBtn');
  if (now < S.crateReady) { $('crateLbl').textContent = 'Crate in ' + mmss(S.crateReady - now); cb.disabled = true; cb.classList.remove('ready'); }
  else { $('crateLbl').textContent = 'Free Crate'; cb.disabled = false; cb.classList.add('ready'); }

  artist.classList.toggle('working', !!(S.running[S.selected] || S.crew[S.selected]));
  updateTut();
}
const mmss = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// ---------- loop ----------
let lastT = performance.now(), acc = 0, saveAcc = 0;
const floatGate = {};
function tick(t) {
  const dt = Math.min(0.25, (t - lastT) / 1000); lastT = t;
  LOC().stations.forEach(st => {
    if (!lvl(st.id) || !els[st.id]) return;
    const auto = !!S.crew[st.id];
    if (!auto && !S.running[st.id]) { els[st.id].bar.style.width = '0%'; return; }
    S.prog[st.id] = (S.prog[st.id] || 0) + dt / cycleTime(st);
    if (S.prog[st.id] >= 1) {
      const n = auto ? Math.floor(S.prog[st.id]) : 1;
      const v = payout(st) * n * mult();
      earn(v);
      if (!auto || st.id === S.selected) sfx('cash');
      if (!floatGate[st.id] || t - floatGate[st.id] > 450) { floater(st, '+' + fmt(v)); floatGate[st.id] = t; }
      if (auto) S.prog[st.id] -= n; else { S.prog[st.id] = 0; S.running[st.id] = false; }
    }
    els[st.id].bar.style.width = (Math.min(1, S.prog[st.id]) * 100) + '%';
  });
  acc += dt; saveAcc += dt;
  if (acc > 0.1) { render(); acc = 0; }
  if (saveAcc > 5) { save(); saveAcc = 0; }
  requestAnimationFrame(tick);
}

function offline() {
  const now = Date.now(), last = S.last || now;
  const away = (now - last) / 1000, secs = Math.min(S.perks.nightOwl ? OFFLINE_OWL : OFFLINE_BASE, away);
  if (secs < 30) return;
  // hype time that overlapped the counted part of the time away pays double
  const hyped = Math.max(0, Math.min(secs, (Math.min(S.hypeUntil, last + secs * 1000) - last) / 1000));
  const v = Math.round(perSec() * (secs + hyped));
  if (v < 1) return;
  earn(v); pendingBonus = v;
  const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60);
  openSheet(`<div class="welcome"><h2>Welcome back</h2><p>Your crew kept working for ${h ? h + 'h ' : ''}${m}m${away > secs ? ' (the most offline time you can earn)' : ''}.</p><span class="amt">+${fmt(v)}</span></div>
    <button class="cta pink" data-ad="bonus">${S.perks.adFree ? 'Double it' : 'Watch ad: double it'}</button>
    <button class="ghost" data-close>Collect ${fmt(v)}</button>`);
}

function start(data) {
  S = (data && data.state) ? Object.assign(fresh(), data.state) : (load() || fresh());
  if (!LOCATIONS[S.loc]) S.loc = 0;
  if (!S.vol) S.vol = { master: 80, music: S.music === false ? 0 : 70, sfx: S.sound === false ? 0 : 80 };
  delete S.music; delete S.sound; delete S.hypeReady;
  S.owned = Object.assign({ basic: true }, S.owned); S.perks = S.perks || {};
  S.equip = Object.assign({ top: 'basic', hat: null, neck: null, face: null }, S.equip);
  S.stats = Object.assign({ upgrades: 0, unlocks: 0, hires: 0, crates: 0, hypes: 0, maxLevel: 1, lifetime: 0 }, S.stats);
  S.goalsDone = S.goalsDone || {};
  if (S.tut == null) S.tut = (S.stats.hires > 0 || S.loc > 0 || S.albums > 0) ? TUT.length : 0;
  S.stats.maxLevel = Math.max(S.stats.maxLevel, ...Object.values(S.levels));
  applyLook(); buildRoom(); fit();
  if (!(data && data.state)) {
    offline();
    if (dailyReady()) { if ($('scrim').hidden) openTab('daily'); else pendingDaily = true; }
  }
  render(); save();
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(tick); });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.claude?.hot?.snapshot?.(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
