<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122A">
<meta name="description" content="Studio Hustle: an idle music tycoon. Rise from a rundown apartment to the stadium.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio Hustle">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
html { height: 100%; background: #14122A; }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Studio Hustle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone game. HUD on top, the room fills the middle with floating side buttons, a tab bar at the bottom; tapping a station opens its upgrade card. Deliberately one look: a mid-purple UI around bright rooms. */
:root {
  --ink: #2A2452;
  --panel: #3A336F;
  --panel-2: #4A4285;
  --line: #5C5398;
  --text: #FFFDF7;
  --muted: #DAD4F2;
  --deep: #14122A;
  --cash: #8BF0A0;
  --gem: #FFC94A;
  --accent: #FF6FAE;
  --floor: #4A3B33;
  --go: #2FB653;
  --skin: #C68A5C;
  --phones: #FF6FAE;
  --display: 'Bungee', 'Arial Black', Impact, sans-serif;
  --body: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--text); font-family: var(--body);
  overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font-family: var(--body); color: inherit; cursor: pointer; border: none; background: none; padding: 0; }
button:focus-visible { outline: 3px solid var(--gem); outline-offset: 2px; }
/* the game is pinned to the real screen edges and handles the notch and home bar itself */
.app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); background: var(--ink); }

/* HUD */
.hud { display: flex; align-items: center; gap: 8px; padding-block: 12px 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.pill { height: 42px; border-radius: 999px; background: var(--panel); display: flex; align-items: center; gap: 8px; }
.cash-pill { flex: 1; min-width: 0; padding: 0 14px 0 6px; }
.coin { width: 30px; height: 30px; border-radius: 50%; background: var(--cash); color: var(--deep); font-family: var(--display); font-size: 16px; display: grid; place-items: center; flex: none; }
.cash-col { display: flex; flex-direction: column; min-width: 0; line-height: 1; }
.cash-num { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cash-rate { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gem-pill { padding: 0 4px 0 10px; }
.gem-num { font-family: var(--display); font-size: 17px; }
.round-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--gem); color: var(--deep); display: grid; place-items: center; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text); }

/* Room */
.room-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; background-color: var(--floor); background-repeat: repeat; transform: translateZ(0); }
.stage { position: absolute; left: 50%; top: 0; width: 390px; height: 600px; transform-origin: top center; }
.abs { position: absolute; }
.loc-chip { position: absolute; top: 8px; left: max(10px, env(safe-area-inset-left, 0px)); z-index: 5; display: flex; align-items: center; gap: 6px;
  background: rgba(20,18,42,.82); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 12px; font-weight: 700; pointer-events: none; }
.loc-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.fame-chip { position: absolute; top: 42px; left: max(10px, env(safe-area-inset-left, 0px)); z-index: 5; background: rgba(20,18,42,.82); color: var(--gem);
  border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; pointer-events: none; }
.daily-btn { position: absolute; top: 8px; right: max(10px, env(safe-area-inset-right, 0px)); z-index: 5; width: 48px; height: 48px; border-radius: 14px;
  background: var(--text); color: var(--ink); display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.daily-btn .dot { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--text); }
.mode-btn { width: 50px; height: 46px; border-radius: 14px; background: var(--panel-2); color: var(--text); font-family: var(--display); font-size: 13px; flex: none; }
.days { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--panel-2); border-radius: 14px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; border: 2px solid transparent; }
.day b { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.day span { font-size: 13px; font-weight: 700; }
.day.got { opacity: .55; } .day.got span { color: var(--cash); }
.day.today { border-color: var(--accent); }
.day.big { grid-column: span 2; }
.vols { display: flex; flex-direction: column; gap: 6px; background: var(--panel-2); border-radius: 16px; padding: 8px 14px; }
.vol { display: grid; grid-template-columns: 112px minmax(0, 1fr) 34px; align-items: center; gap: 10px; min-height: 48px; }
.vol label { font-size: 15px; font-weight: 700; }
.vol output { font-family: var(--display); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.vol input[type=range] { width: 100%; height: 44px; margin: 0; accent-color: var(--accent); background: transparent; }
.toggle { display: flex; align-items: center; justify-content: space-between; background: var(--panel-2); border-radius: 16px; padding: 0 8px 0 14px; height: 56px; font-size: 15px; font-weight: 700; }
.toggle span.sw2 { width: 52px; height: 30px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.toggle span.sw2::after { content: ""; position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); transition: left .2s; }
.toggle[aria-pressed="true"] span.sw2 { background: var(--go); }
.toggle[aria-pressed="true"] span.sw2::after { left: 26px; }

.station { position: absolute; display: block; }
.badge { position: absolute; display: flex; align-items: center; gap: 4px; background: var(--text); color: var(--deep);
  border-radius: 999px; padding: 3px 9px 3px 3px; font-size: 13px; font-weight: 700; z-index: 3; white-space: nowrap; transition: background .2s; }
.station.sel .badge { background: var(--accent); }
.badge .ic { width: 24px; height: 24px; border-radius: 50%; background: var(--deep); display: grid; place-items: center; }
.badge .up { width: 18px; height: 18px; border-radius: 50%; background: var(--go); display: grid; place-items: center; margin-left: 2px; }
.prog { position: absolute; height: 7px; border-radius: 999px; background: rgba(20,18,42,.75); overflow: hidden; z-index: 3; }
.prog i { display: block; height: 100%; width: 0; background: var(--cash); border-radius: 999px; }
.sel-ring { position: absolute; inset: -6px; border-radius: 16px; border: 3px solid var(--accent); opacity: 0; transition: opacity .2s; pointer-events: none; }
.station.sel .sel-ring { opacity: 1; }
.tap-hint { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  border: 3px solid var(--text); opacity: 0; pointer-events: none; z-index: 4; }
/* only the selected station hints, and it rests between pulses */
.station.idle.sel .tap-hint { animation: ping 3s ease-out infinite; }
.app.tut-on .tap-hint { display: none; }
@keyframes ping { 0% { transform: scale(.6); opacity: .8 } 40% { transform: scale(1.5); opacity: 0 } 100% { transform: scale(1.5); opacity: 0 } }
.cloud { position: absolute; left: -40px; width: 34px; height: 11px; border-radius: 999px; background: #FFFFFF; opacity: .9; animation: drift 24s linear infinite; }
.birds { position: absolute; top: 18px; left: -30px; animation: drift 19s linear infinite; animation-delay: -6s; }
@keyframes drift { to { transform: translateX(260px); } }
.tw { animation: twinkle 3.2s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .25; } }

.lockspot { position: absolute; inset: 0; border-radius: 16px; border: 3px dashed #E8E2F4; background: rgba(20,18,42,.55);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; z-index: 2; }
.lockspot .lk { width: 46px; height: 46px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; }
.lockspot b { font-size: 14px; font-weight: 700; text-align: center; padding: 0 6px; }
.price { font-family: var(--display); font-size: 14px; color: var(--ink); background: #8C86A6; border-radius: 999px; padding: 3px 12px; }
.lockspot.can .price { background: var(--cash); }
.lockspot.can { border-color: var(--cash); }

.crew { position: absolute; width: 62px; height: 83px; z-index: 5; pointer-events: none; }
.crew svg { animation: bob .6s ease-in-out infinite alternate; }
.artist { position: absolute; width: 70px; height: 96px; z-index: 6; transition: left .55s ease, top .55s ease; pointer-events: none; }
.artist.working svg { animation: bob .45s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-4px) } }
.skin { fill: var(--skin); } .phones { fill: var(--phones); }

.floater { position: absolute; z-index: 8; font-family: var(--display); font-size: 17px; color: var(--cash); pointer-events: none;
  text-shadow: 0 2px 0 rgba(0,0,0,.45); animation: rise 1s ease-out forwards; white-space: nowrap; }
@keyframes rise { from { transform: translate(-50%, 0); opacity: 1 } to { transform: translate(-50%, -46px); opacity: 0 } }

/* Bottom controls */
.controls { display: flex; flex-direction: column; gap: 8px; padding-block: 10px 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--ink); }
.sbar { height: 62px; box-sizing: border-box; background: var(--panel); border: 2px solid var(--accent); border-radius: 18px;
  padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; }
.sbar-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.sbar-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbar-name small { color: var(--muted); font-weight: 600; font-size: 13px; }
.mile { height: 5px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.mile i { display: block; height: 100%; background: var(--gem); width: 0; }
.mile-label { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-btn { -webkit-touch-callout: none; touch-action: none; height: 46px; padding: 0 14px; border-radius: 14px; background: var(--cash); color: var(--deep); font-family: var(--display); font-size: 15px;
  display: flex; align-items: center; gap: 6px; flex: none; box-shadow: 0 3px 0 #4FA864; transition: transform .08s; }
.up-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #4FA864; }
.up-btn:disabled { background: var(--panel-2); color: var(--muted); box-shadow: none; cursor: default; }
.actions { display: flex; gap: 8px; }
.act { flex: 1; height: 46px; border-radius: 14px; background: var(--panel); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 7px; }
.act.hype { flex: 1.25; background: var(--accent); color: var(--deep); }
.act:disabled { opacity: .55; cursor: default; }
.act.ready { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(255,201,74,.35) } }

.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--ink); border-top: 1px solid var(--panel-2);
  padding-top: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tab { height: 52px; color: var(--muted); font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
.tab.on { color: var(--accent); }
.mult { flex: none; font-family: var(--display); font-size: 13px; color: var(--deep); background: var(--gem); border-radius: 999px; padding: 2px 8px; margin-left: auto; }
.side { position: absolute; top: 10px; z-index: 5; display: flex; flex-direction: column; gap: 16px; }
.side-l { left: max(10px, env(safe-area-inset-left, 0px)); }
.side-r { right: max(10px, env(safe-area-inset-right, 0px)); }
.sbtn { position: relative; width: 54px; height: 54px; border-radius: 16px; background: var(--text); color: var(--deep); display: grid; place-items: center;
  box-shadow: 0 4px 0 rgba(20,18,42,.35); }
.sbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(20,18,42,.35); }
.sbtn.shop { background: #8FD8F5; }
.sbtn.crate { background: var(--gem); }
.sbtn:disabled { filter: saturate(.35) brightness(.92); }
.sbtn .cap { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--deep); color: var(--text);
  font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 7px; font-variant-numeric: tabular-nums; }
.bang { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #F0453A; color: #fff; border: 2px solid var(--text);
  font: 700 13px/16px var(--body); text-align: center; box-sizing: border-box; }
.tab .bang { top: 0; right: 50%; margin-right: -24px; }
.pop { position: absolute; z-index: 12; left: 12px; width: 280px; max-width: calc(100% - 24px); box-sizing: border-box; background: var(--text); color: var(--deep);
  border-radius: 18px; padding: 10px 12px 12px; box-shadow: 0 10px 30px rgba(10,8,30,.45); display: flex; flex-direction: column; gap: 7px; animation: popin .16s ease-out; }
@keyframes popin { from { transform: scale(.94); opacity: 0; } }
.pop-arrow { position: absolute; width: 18px; height: 18px; background: var(--text); transform: rotate(45deg); left: 50%; margin-left: -9px; }
.pop-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.pop-title { display: flex; flex-direction: column; line-height: 1.1; }
.pop-title b { font-family: var(--display); font-size: 16px; font-weight: 400; }
.pop-title span { font-size: 13px; font-weight: 700; color: #6A6390; }
.pop-x { width: 32px; height: 32px; margin: -4px -6px 0 0; border-radius: 10px; color: #6A6390; display: grid; place-items: center; }
.pop-mile { display: flex; align-items: center; gap: 6px; }
.pop-mile .mile { flex: 1; height: 8px; background: #E4DFF2; }
.pop-next { font-size: 11px; font-weight: 700; color: #6A6390; white-space: nowrap; }
.pop-row { display: flex; align-items: center; gap: 6px; }
.pop-star { color: var(--gem); font-size: 18px; line-height: 1; text-shadow: 0 1px 0 #B8860B; }
.pop-stats { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.pop-stats span { display: flex; align-items: center; gap: 6px; }
.pop-stats b { font-family: var(--display); font-weight: 400; }
.coin-s { width: 18px; height: 18px; border-radius: 50%; background: var(--cash); color: var(--deep); font: 400 11px/18px var(--display); text-align: center; font-style: normal; }
.pop .mode-btn { background: #E4DFF2; color: var(--deep); }
.pop .mode-btn { width: 44px; height: 44px; font-size: 12px; }
.pop .up-btn { min-width: 104px; justify-content: center; height: 44px; font-size: 16px; padding: 0 12px; }
.pop .up-btn:disabled { background: #D9D4E8; color: #8C86A6; }
.testnote { font-size: 12px !important; text-align: center; }
.offer { position: relative; display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 10px; align-items: center; border-radius: 18px; padding: 18px 12px 12px; color: var(--deep); box-shadow: 0 4px 0 rgba(20,18,42,.3); text-align: left; overflow: visible; isolation: isolate; }
.offer:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(20,18,42,.3); }
.offer:disabled { opacity: .7; }
.offer::after { content: ""; position: absolute; inset: 0; border-radius: 18px; z-index: -1; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 48%, transparent 60%) no-repeat; background-size: 250% 100%; animation: sheen 4.5s ease-in-out infinite; }
@keyframes sheen { 0%, 55% { background-position: 130% 0; } 100% { background-position: -130% 0; } }
.offer .rib { position: absolute; top: -8px; left: -4px; background: #F0453A; color: #fff; font: 400 12px var(--display); padding: 3px 10px; border-radius: 8px 8px 8px 2px; transform: rotate(-4deg); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.offer-art { position: relative; display: grid; place-items: center; height: 72px; }
.offer-art svg { width: 68px; height: 68px; }
.offer-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.offer-body b { font: 400 19px/1.1 var(--display); }
.offer-body > span { font-size: 14px; font-weight: 600; line-height: 1.3; color: rgba(20,18,42,.78); }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font-size: 12px; font-weight: 700; background: rgba(255,255,255,.6); border-radius: 999px; padding: 2px 8px; }
.paybtn { display: flex; align-items: center; justify-content: center; min-width: 78px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--deep); color: #fff; font: 400 16px/1 var(--display); box-sizing: border-box; }
.offer:disabled .paybtn { background: rgba(20,18,42,.35); }
.banner { margin-inline: calc(-1 * max(18px, env(safe-area-inset-left, 0px))); padding: 9px 12px; background: var(--panel-2); text-align: center; font: 400 15px var(--display); letter-spacing: .02em; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { position: relative; display: flex; flex-direction: column; border-radius: 16px; overflow: visible; box-shadow: 0 4px 0 rgba(20,18,42,.35); }
.card .price { border-radius: 0 0 16px 16px; }
.card:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(20,18,42,.35); }
.card .art { position: relative; height: 96px; display: grid; place-items: center; }
.card .ttl { padding: 0 6px 6px; font-size: 12px; font-weight: 700; line-height: 1.2; color: var(--deep); min-height: 30px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.card .ttl small { font-size: 10px; font-weight: 700; opacity: .65; text-transform: uppercase; letter-spacing: .06em; }
.card .tag { position: absolute; top: 6px; left: 6px; z-index: 2; color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 7px; }
.rib.small { position: absolute; top: -8px; right: -4px; left: auto; z-index: 3; font-size: 10px; padding: 2px 8px; background: #F0453A; color: #fff; font-family: var(--display); border-radius: 8px 8px 2px 8px; transform: rotate(4deg); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
/* glow, sparkle and float so the shop feels like treasure */
.glow::before { content: ""; position: absolute; left: 50%; top: 48%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.45) 40%, rgba(255,255,255,0) 70%); animation: pulseglow 2.6s ease-in-out infinite; }
.glow > svg { position: relative; animation: floaty 3s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(20,18,42,.18)); }
.spk { position: absolute; z-index: 1; width: 12px; height: 12px; background: #fff; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); transform: scale(var(--k, 1)); animation: sparkle 2.4s ease-in-out infinite; pointer-events: none; }
.card.green .spk { background: #FFF7C2; }
@keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(calc(var(--k, 1) * .3)) rotate(0); } 50% { opacity: 1; transform: scale(var(--k, 1)) rotate(45deg); } }
@keyframes floaty { 50% { transform: translateY(-4px); } }
@keyframes pulseglow { 50% { transform: scale(1.12); opacity: .8; } }
.card.green .art { background: radial-gradient(circle at 50% 45%, #B4F5BE 0%, transparent 65%); border-radius: 16px 16px 0 0; }
.card .qty { z-index: 2; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); background: var(--deep); color: #fff; font: 400 12px var(--display); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.card .price { min-height: 36px; padding: 0 4px; font: 400 15px/1 var(--display); display: flex; align-items: center; justify-content: center; gap: 4px; }
.card.gold { background: #FFD866; } .card.gold .price { background: #F0A81E; color: var(--deep); }
.card.green { background: #8BE39A; } .card.green .price { background: #1D7F35; color: #fff; }
.card.outfit { background: #D9CCFF; } .card.outfit .price { background: #6A45C8; color: #fff; }
.card:disabled { opacity: .65; }
i.g { display: inline-block; width: 13px; height: 13px; background: #FFC94A; clip-path: polygon(25% 0, 75% 0, 100% 35%, 50% 100%, 0 35%); border: none; }

let busMaster = null, busMusic = null, busSfx = null;
const volOf = k => Math.max(0, Math.min(100, (S && S.vol && S.vol[k] != null) ? S.vol[k] : 80)) / 100;
// perceptual curve so the low end of each slider isn't all "loud"
const curve = v => v * v;
function applyVolumes() {
  if (!actx) return;
  const t = actx.currentTime;
  busMaster.gain.setTargetAtTime(curve(volOf('master')), t, 0.03);
  busMusic.gain.setTargetAtTime(curve(volOf('music')), t, 0.03);
  busSfx.gain.setTargetAtTime(curve(volOf('sfx')), t, 0.03);
}
function ac() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    busMaster = actx.createGain(); busMaster.connect(actx.destination);
    busMusic = actx.createGain(); busMusic.connect(busMaster);
    busSfx = actx.createGain(); busSfx.connect(busMaster);
    applyVolumes();
  }
  if (actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function tone(freq, dur, type, vol, when = 0, slideTo = 0) {
  const a = ac(); if (!a) return;

  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(busSfx); o.start(t0); o.stop(t0 + dur + 0.02);
}
const SFX = {
  cash: () => { tone(1175, 0.06, 'sine', 0.03); tone(1568, 0.08, 'sine', 0.02, 0.035); },
  upgrade: () => { tone(523, 0.08, 'square', 0.03); tone(784, 0.12, 'square', 0.03, 0.06); },
  milestone: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.03, i * 0.06)),
  unlock: () => { tone(392, 0.12, 'triangle', 0.06); tone(523, 0.12, 'triangle', 0.06, 0.08); tone(784, 0.25, 'triangle', 0.06, 0.16); },
  reward: () => [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.18, 'sine', 0.05, i * 0.07)),
  hype: () => tone(220, 0.35, 'sawtooth', 0.04, 0, 880),
  move: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, i === 4 ? 0.5 : 0.16, 'square', 0.035, i * 0.11)),
  tap: () => tone(660, 0.04, 'sine', 0.03),
  click: () => { tone(900, 0.025, 'triangle', 0.035); tone(1350, 0.02, 'sine', 0.015, 0.012); },
  denied: () => tone(180, 0.12, 'square', 0.025),

function sfx(name) {
  if (!S || volOf('sfx') === 0 || volOf('master') === 0) return;
  if (name === 'cash') { const n = performance.now(); if (n - lastDing < cashGap) return; lastDing = n; }
  if (name === 'upgrade') { const n = performance.now(); if (n - lastUp < 90) return; lastUp = n; }
  try { SFX[name](); } catch (e) {}
}
// ---------- music: one looping beat per location ----------
const buffers = {};
let musicSrc = null, musicGain = null, musicTrack = null;
function getBuf(url) {
  if (!buffers[url]) buffers[url] = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(b => new Promise((res, rej) => ac().decodeAudioData(b, res, rej)));
  return buffers[url];
}
// skip encoder silence at the edges (max 0.2s each side) so the loop is seamless

  let s = 0; while (s < cap && Math.abs(d[s]) < th) s++;
  let e = d.length - 1; while (e > d.length - cap && Math.abs(d[e]) < th) e--;
  return [s / sr, (e + 1) / sr];
}
function stopMusic() {
  if (!musicSrc) return;
  const s = musicSrc, g = musicGain, a = actx;
  musicSrc = null; musicGain = null;
  try { g.gain.setTargetAtTime(0.0001, a.currentTime, 0.25); s.stop(a.currentTime + 1.2); } catch (e) {}
}
async function playMusic() {
  if (!S || volOf('music') === 0 || volOf('master') === 0 || !actx) { stopMusic(); musicTrack = null; return; }
  const url = LOC().track;
  if (musicTrack === url && musicSrc) return;
  musicTrack = url;
  let buf; try { buf = await getBuf(url); } catch (e) { musicTrack = null; return; }
  if (musicTrack !== url || volOf('music') === 0 || volOf('master') === 0) return;
  stopMusic();
  const a = actx, g = a.createGain(), src = a.createBufferSource();
  const [ls, le] = loopPoints(buf);
  src.buffer = buf; src.loop = true; src.loopStart = ls; src.loopEnd = le;
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.5, a.currentTime + 1.5);
  src.connect(g).connect(busMusic); src.start(0, ls);
  musicSrc = src; musicGain = g;
}
document.addEventListener('pointerdown', () => { if (S && volOf('master') > 0) { ac(); playMusic(); } }, { once: true });
document.addEventListener('visibilitychange', () => {

  if (document.hidden) actx.suspend().catch(() => {}); else actx.resume().catch(() => {});
});

// ---------- daily reward ----------
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };
const dailyReady = () => S.daily.last !== dayKey();
const nextStreak = () => S.daily.last === yesterdayKey() ? (S.daily.streak % 7) + 1 : 1;
function dailyCash(minutes) {
  const first = LOC().stations[0];
  const best = LOC().stations.filter(st => lvl(st.id)).reduce((a, st) => Math.max(a, payout(st) / cycleTime(st)), first.base * fame() / first.cycle);
  return Math.round(Math.max(perSec(), best) * 60 * minutes);
}
const KEY = 'artist-tycoon-v1';   // save key kept so existing progress carries over
function load() {

    if (raw) { const s = Object.assign(fresh(), JSON.parse(raw)); if (!LOCATIONS[s.loc]) s.loc = 0; return s; }
  } catch (e) {}

}

// ---------- economy ----------
const LOC = () => LOCATIONS[S.loc];
const def = id => LOC().stations.find(s => s.id === id);
const lvl = id => S.levels[id] || 0;
const milesHit = L => MILES.filter(m => L >= m).length;
const cycleTime = st => st.cycle / Math.pow(2, milesHit(lvl(st.id)));
const fame = () => 1 + FAME_PER_ALBUM * (S.albums || 0);
const gearMult = () => 1 + SLOTS.reduce((a, [sl]) => { const it = itemById(S.equip && S.equip[sl]); return a + (it ? it.bonus : 0); }, 0);
const boostMult = () => (S.perks.goldenMic ? 2 : 1) * (S.perks.monitors ? 1.5 : 1);
const payout = st => st.base * lvl(st.id) * fame() * gearMult() * boostMult();
const bestRate = () => LOC().stations.filter(st => lvl(st.id)).reduce((a, st) => Math.max(a, payout(st) / cycleTime(st)), 0);
const skipValue = secs => Math.round(Math.max(perSec(), bestRate()) * secs);
const upCost = st => Math.ceil(st.cost * Math.pow(st.growth, lvl(st.id) - 1));
// cost of buying n levels at once: geometric series from the current level's price
const bulkCost = (st, n) => Math.ceil(upCost(st) * (Math.pow(st.growth, n) - 1) / (st.growth - 1));
function buyPlan(st) {
  if (S.buyMode === 'max') {
    const c0 = upCost(st), g = st.growth;
    let n = Math.floor(Math.log(1 + S.cash * (g - 1) / c0) / Math.log(g));
    n = Math.max(1, n);
    while (n > 1 && bulkCost(st, n) > S.cash) n--;   // guard against float rounding
    return { n, cost: bulkCost(st, n) };
  }
  const n = S.buyMode === 10 ? 10 : 1;
  return { n, cost: bulkCost(st, n) };
}
const hypeOn = () => Date.now() < S.hypeUntil;
const mult = () => hypeOn() ? 2 : 1;
const perSec = () => LOC().stations.reduce((a, st) => a + (lvl(st.id) && S.crew[st.id] ? payout(st) / cycleTime(st) : 0), 0);
const movePct = () => Math.min(100, S.earned / LOC().goal * 100);

function fmt(n) {
  if (n < 1000) return '$' + (n < 10 && n % 1 ? n.toFixed(1) : Math.floor(n));
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
  let i = -1; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return '$' + (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + u[i];
}

function tapStation(st) {
  if (!lvl(st.id)) {
    if (S.cash >= st.unlock) {
      S.cash -= st.unlock; S.levels[st.id] = 1; S.selected = st.id; S.stats.unlocks++;
      sfx('unlock'); toast(st.name + ' unlocked'); moveArtist(st); save();
    } else { sfx('denied'); toast('Need ' + fmt(st.unlock) + ' to unlock ' + st.name); }
    render(); return;
  }
  S.selected = st.id;

        <a class="ghost" href="mailto:${CONTACT}?subject=Studio%20Hustle%20feedback%20(Build%20${BUILD})" style="display:grid;place-items:center;text-decoration:none;color:var(--text)">Open email app</a>
      </div>
      <p>Studio Hustle · Build ${BUILD} · Music by Elijah Gray</p>
      <p>Progress saves in this browser. Starting over wipes everything, including albums and fame.</p>
      <button class="ghost" data-reset-ask>Start a new career</button>`);
  } else if (tab === 'reset') {
    openSheet(`<div class="sheet-head"><h2>Start over?</h2>${closeBtn()}</div>
      <p>This erases all progress in this browser and can't be undone.</p>
      <button class="cta pink" data-reset>Yes, start over</button>
      <button class="ghost" data-close>Keep my progress</button>`);
  }
}

const _unusedSwatch = it => { const c = it.look.body || it.look.color; const tr = it.look.trim || 'transparent';
  return `<span style="width:24px;height:24px;border-radius:50%;background:${c};box-shadow:inset 0 0 0 4px ${tr};outline:2px solid rgba(255,255,255,.15)"></span>`; };
const hms = ms => { const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };
function applyLook() {
  document.documentElement.style.setProperty('--skin', S.skin);
  document.documentElement.style.setProperty('--phones', S.phones);
  artist.innerHTML = smallArtist();
}

// ---------- render ----------
function render() {
  $('cash').textContent = fmt(S.cash);
  const ps = perSec() * mult();
  $('rate').textContent = ps > 0 ? '+' + fmt(ps) + ' / sec' : 'Tap a station to work';
  $('gems').textContent = S.gems;
  const mp = Math.floor(movePct());
  $('movePct').textContent = mp + '%';
  $('movePct').classList.toggle('full', mp >= 100);

  LOC().stations.forEach(st => {
    const e = els[st.id]; if (!e) return;
    const L = lvl(st.id), unlocked = L > 0;
    e.crew.hidden = !(unlocked && S.crew[st.id]);
    e.furn.hidden = !unlocked; e.badge.hidden = !unlocked; e.prog.hidden = !unlocked; e.lock.hidden = unlocked;
    e.lock.classList.toggle('can', !unlocked && S.cash >= st.unlock);
    e.b.classList.toggle('sel', unlocked && S.selected === st.id);
    e.b.classList.toggle('idle', unlocked && !S.crew[st.id] && !S.running[st.id]);
    e.b.setAttribute('aria-label', unlocked ? `${st.name}, level ${L}` : `Unlock ${st.name} for ${fmt(st.unlock)}`);
    if (unlocked) { e.lv.textContent = L; e.up.hidden = S.cash < upCost(st); }
  });

  const st = def(S.selected), L = lvl(st.id);
  const next = MILES.find(m => L < m), prev = [0, ...MILES].filter(m => L >= m).pop();
  const ct = cycleTime(st);
  $('popLv').textContent = 'Level ' + L;
  $('sbName').textContent = st.name;
  $('popPay').textContent = fmt(payout(st) * mult());
  $('popTime').textContent = (ct < 1 ? ct.toFixed(2) : ct.toFixed(1)) + 's';
  $('sbMile').style.width = next ? ((L - prev) / (next - prev) * 100) + '%' : '100%';
  $('sbMileLabel').textContent = next ? `2x at Lv ${next}` : 'Max speed';
  const plan = buyPlan(st);
  $('modeBtn').textContent = S.buyMode === 'max' ? 'MAX' : 'x' + S.buyMode;
  $('upCost').textContent = (S.buyMode === 1 ? '' : '+' + plan.n + ' ') + fmt(plan.cost);
  $('upBtn').disabled = S.cash < plan.cost;
  $('upBtn').setAttribute('aria-label', `Upgrade ${st.name} by ${plan.n} level${plan.n > 1 ? 's' : ''} for ${fmt(plan.cost)}`);
  $('dailyDot').hidden = !dailyReady();
  $('goalsDot').hidden = !activeGoals().some(goalReady);
  $('crewBang').hidden = !LOC().stations.some(x => lvl(x.id) && !S.crew[x.id] && S.cash >= x.crewCost);
  $('styleBang').hidden = !(S.newItems && S.newItems.length);
  const m = mult() * boostMult();
  $('mult').hidden = m <= 1; $('mult').textContent = 'x' + (Math.round(m * 10) / 10);

  const now = Date.now();
  const hb = $('hypeBtn');
  $('hypeLbl').textContent = hypeOn() ? hms(S.hypeUntil - now) : '2x Hype';
  $('hypeBtn').classList.toggle('active', hypeOn());
  const cb = $('crateBtn'), crateWait = now < S.crateReady;
  $('crateLbl').textContent = crateWait ? mmss(S.crateReady - now) : 'Free';
  cb.disabled = crateWait; $('crateBang').hidden = crateWait;

  artist.classList.toggle('working', !!(S.running[S.selected] || S.crew[S.selected]));
  placePop();
  updateTut();
}
const mmss = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// ---------- loop ----------
let lastT = performance.now(), acc = 0, saveAcc = 0;
const floatGate = {};
function tick(t) {
  const dt = Math.min(0.25, (t - lastT) / 1000); lastT = t;
  LOC().stations.forEach(st => {
    if (!lvl(st.id) || !els[st.id]) return;
    const auto = !!S.crew[st.id];
    if (!auto && !S.running[st.id]) { els[st.id].bar.style.width = '0%'; return; }
    S.prog[st.id] = (S.prog[st.id] || 0) + dt / cycleTime(st);
    if (S.prog[st.id] >= 1) {
      const n = auto ? Math.floor(S.prog[st.id]) : 1;
      const v = payout(st) * n * mult();
      earn(v);
      // fast stations ding at most about once a second so it never turns into a buzz
      if (!auto || st.id === S.selected) { cashGap = cycleTime(st) < 0.9 ? 1100 : 400; sfx('cash'); }
      if (!floatGate[st.id] || t - floatGate[st.id] > 450) { floater(st, '+' + fmt(v)); floatGate[st.id] = t; }
      if (auto) S.prog[st.id] -= n; else { S.prog[st.id] = 0; S.running[st.id] = false; }
    }
    els[st.id].bar.style.width = (Math.min(1, S.prog[st.id]) * 100) + '%';
  });
  acc += dt; saveAcc += dt;
  if (acc > 0.1) { render(); acc = 0; }
  if (saveAcc > 5) { save(); saveAcc = 0; }
  requestAnimationFrame(tick);
}

function offline() {
  const now = Date.now(), last = S.last || now;
  const away = (now - last) / 1000, secs = Math.min(S.perks.nightOwl ? OFFLINE_OWL : OFFLINE_BASE, away);
  if (secs < 30) return;
  // hype time that overlapped the counted part of the time away pays double
  const hyped = Math.max(0, Math.min(secs, (Math.min(S.hypeUntil, last + secs * 1000) - last) / 1000));
  const v = Math.round(perSec() * (secs + hyped));
  if (v < 1) return;
  earn(v); pendingBonus = v;
  const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60);
  openSheet(`<div class="welcome"><h2>Welcome back</h2><p>Your crew kept working for ${h ? h + 'h ' : ''}${m}m${away > secs ? ' (the most offline time you can earn)' : ''}.</p><span class="amt">+${fmt(v)}</span></div>
    <button class="cta pink" data-ad="bonus">${S.perks.adFree ? 'Double it' : 'Watch ad: double it'}</button>
    <p class="adnote">${adGemNote()}</p>
    <button class="ghost" data-close>Collect ${fmt(v)}</button>`);
}

function start(data) {
  S = (data && data.state) ? Object.assign(fresh(), data.state) : (load() || fresh());
  if (!LOCATIONS[S.loc]) S.loc = 0;
  if (!S.vol) S.vol = { master: 80, music: S.music === false ? 0 : 70, sfx: S.sound === false ? 0 : 80 };
  delete S.music; delete S.sound; delete S.hypeReady;
  S.owned = Object.assign({ basic: true }, S.owned); S.perks = S.perks || {};
  S.equip = Object.assign({ top: 'basic', hat: null, neck: null, face: null }, S.equip);
  S.stats = Object.assign({ upgrades: 0, unlocks: 0, hires: 0, crates: 0, hypes: 0, maxLevel: 1, lifetime: 0 }, S.stats);
  S.goalsDone = S.goalsDone || {};
  if (S.tut == null) S.tut = (S.stats.hires > 0 || S.loc > 0 || S.albums > 0) ? TUT.length : 0;
  S.stats.maxLevel = Math.max(S.stats.maxLevel, ...Object.values(S.levels));
  applyLook(); buildRoom(); fit();
  if (!(data && data.state)) {
    offline();
    if (dailyReady()) { if ($('scrim').hidden) openTab('daily'); else pendingDaily = true; }
  }
  render(); save();
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(tick); });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.claude?.hot?.snapshot?.(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
